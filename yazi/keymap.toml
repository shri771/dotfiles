# Yazi keymap configuration
# Docs: https://yazi-rs.github.io/docs/configuration/keymap

[[mgr.prepend_keymap]]
on   = [ "<C-n>" ]
run  = 'shell -- ya pub dds-notify --str "$0"'
desc = "Notify current selection"

# --- Navigation ---
[[mgr.prepend_keymap]]
on   = [ "g", "h" ]
run  = "cd ~"
desc = "Go home"

[[mgr.prepend_keymap]]
on   = [ "g", "c" ]
run  = "cd ~/.config"
desc = "Go to ~/.config"

[[mgr.prepend_keymap]]
on   = [ "g", "d" ]
run  = "cd ~/dotfiles"
desc = "Go to dotfiles"

[[mgr.prepend_keymap]]
on   = [ "g", "D" ]
run  = "cd ~/Downloads"
desc = "Go to Downloads"

# --- Toggle hidden files ---
[[mgr.prepend_keymap]]
on   = [ "." ]
run  = "hidden toggle"
desc = "Toggle hidden files"

# --- zoxide / fzf jumping (bundled plugins; need zoxide & fzf binaries) ---
[[mgr.prepend_keymap]]
on   = [ "z" ]
run  = "plugin zoxide"
desc = "Jump via zoxide"

[[mgr.prepend_keymap]]
on   = [ "Z" ]
run  = "plugin fzf"
desc = "Jump via fzf"
