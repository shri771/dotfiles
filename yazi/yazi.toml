# Yazi main configuration
# Docs: https://yazi-rs.github.io/docs/configuration/yazi

[mgr]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_events   = ["click", "scroll"]
title_format   = "Yazi: {cwd}"

[preview]
wrap            = "no"
tab_size        = 2
max_width       = 600
max_height      = 900
cache_dir       = ""
image_delay     = 30
image_filter    = "triangle"
image_quality   = 75
sixel_fraction  = 15
ueberzug_scale  = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = '$EDITOR "$@"', desc = "$EDITOR", block = true, for = "unix" },
]
open = [
  { run = 'xdg-open "$@"', desc = "Open (xdg default)", for = "linux" },
]
reveal = [
  { run = 'xdg-open "$(dirname "$0")"', desc = "Reveal", for = "linux" },
]
extract = [
  { run = '7z x -y "$@"', desc = "Extract here (7z)", for = "unix" },
]

[open]
rules = [
  # Directories: normal navigation is handled by the `smart-enter` plugin
  # (see keymap.toml) which calls Yazi's internal `enter` — it never reaches
  # this rule. This entry only fires on an explicit "open" (e.g. mouse
  # double-click); `open` => xdg-open => the inode/directory default app.
  { url = "*/", use = [ "open", "reveal" ] },

  # Files default to the xdg-open handler so system XDG defaults win;
  # `edit` ($EDITOR) kept as a secondary "open with" alternate.
  { mime = "text/*",                      use = [ "open", "edit", "reveal" ] },
  { mime = "image/*",                     use = [ "open", "reveal" ] },
  { mime = "video/*",                     use = [ "open", "reveal" ] },
  { mime = "audio/*",                     use = [ "open", "reveal" ] },
  { mime = "inode/x-empty",               use = [ "edit", "open", "reveal" ] },
  { mime = "application/json",            use = [ "open", "edit", "reveal" ] },
  { mime = "*/javascript",                use = [ "open", "edit", "reveal" ] },
  { mime = "application/zip",             use = [ "extract", "open", "reveal" ] },
  { mime = "application/gzip",            use = [ "extract", "open", "reveal" ] },
  { mime = "application/x-tar",           use = [ "extract", "open", "reveal" ] },
  { mime = "application/x-bzip",          use = [ "extract", "open", "reveal" ] },
  { mime = "application/x-bzip2",         use = [ "extract", "open", "reveal" ] },
  { mime = "application/x-7z-compressed", use = [ "extract", "open", "reveal" ] },
  { mime = "application/x-rar",           use = [ "extract", "open", "reveal" ] },
  { mime = "application/xz",              use = [ "extract", "open", "reveal" ] },

  # Everything else: xdg-open
  { url = "*", use = [ "open", "edit", "reveal" ] },
]

[plugin]
prepend_fetchers = []
prepend_preloaders = []
prepend_previewers = []

[tasks]
micro_workers    = 10
macro_workers    = 25
bizarre_retry    = 5
image_alloc      = 536870912
image_bound      = [0, 0]
suppress_preload = false

[input]
cursor_blink = false
