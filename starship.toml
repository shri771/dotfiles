# Optimized Starship Configuration
# No leading blank line
add_newline = false

format = "$directory$git_status${custom.git_branch_truncated}\n$character"

# Color palette
palette = 'foo'

[palettes.foo]
blue = '21'
mustard = '#ffaa00'
blu = '#ffd5d8'
skyblue = '#00aaff'
pink = '#ff55ff'

[character]
format = '$symbol'
success_symbol = '[❯](bold green) '
error_symbol = '[❯](bold red) '
vimcmd_symbol = '[❮ ](bold mustard)'

[cmd_duration]
min_time = 500
format = '[](dimmed yellow) [$duration ](bold yellow)'

[directory]
format = '[](#ffd5d8) [$path](#1fd6ff) '
truncation_length = 2
truncation_symbol = ''
home_symbol = '~'

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = '[🍒 PICKING](bold red)'

# Git Status - Using your original symbols with cleaner formatting
[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = 'bold red'
conflicted = '[ ](red bold)'
# ahead      = '[🌽](bright-yellow)'
staged = '[🍂 ](bright-red)'
# staged     = '[ ](bright-green)'
diverged = '[](purple)'
behind = '[⇣](bold bright-red)'
ahead = '[⇡](bold bright-yellow)'
up_to_date = '[](green)'
untracked = '[](cyan)'
# stashed    = '[  ](blue)'
modified = '[](yellow)'
stashed = '[ ](#ff00ff)'
renamed = '[](magenta)'
# deleted    = '[ ](red)'
deleted = '[](red)'

[git_branch]
format = '[$symbol](<bold purple>)[\($branch\)]($style) '
# symbol = '🌱 '
symbol = ' '
style = '#e0536d'
# truncation_length = 15
truncation_symbol = ''
ignore_branches = ['main', 'master']

[custom.git_branch_truncated]
description = "Git branch name with first 4 chars removed"
command = '''
branch=$(git symbolic-ref --quiet --short HEAD) || exit 1
case "$branch" in
  feat/*) printf '%s\n' "${branch#feat/}" ;;
  fix/*) printf '%s\n' "${branch#fix/}" ;;
  *) printf '%s\n' "$branch" ;;
esac
'''
shell = ["sh"]
when = '''
branch=$(git symbolic-ref --quiet --short HEAD) || exit 1
case "$branch" in
  main|master) exit 1 ;;
  *) exit 0 ;;
esac
'''
format = '[$symbol](bold purple)[\($output\)]($style) '
symbol = ' '
style = '#FA5C5C'

[hostname]
ssh_only = false
format = '[$ssh_symbol](bold blue) on [$hostname](bold red) '
trim_at = '.companyname.com'
disabled = false

[sudo]
format = '[$symbol]($style)'
style = 'bold green'
symbol = '💻 '
disabled = false

