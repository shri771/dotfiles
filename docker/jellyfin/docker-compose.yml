services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    # Run as the 'shri' user (uid=1000, gid=100/users) instead of root
    user: 1000:100
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - ./config:/config
      - ./cache:/cache
      # Media libraries — picked up read-only from the host
      - type: bind
        source: /home/shri/Videos
        target: /media
        read_only: true
      - type: bind
        source: /home/shri/Downloads/Music
        target: /music
        read_only: true
    restart: 'unless-stopped'
    # Alternative address used for autodiscovery
    environment:
      - JELLYFIN_PublishedServerUrl=http://localhost:8096
    # May be necessary for docker healthcheck to pass if running in host network mode
    extra_hosts:
      - 'host.docker.internal:host-gateway'
