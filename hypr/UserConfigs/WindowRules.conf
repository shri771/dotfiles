############################################
# Hyprland Window Rules Configuration File #
############################################

# Gamescope Rules
windowrule = no_blur on, match:class ^(gamescope)$
windowrule = fullscreen on, match:class ^(gamescope)$
windowrule = workspace 6 silent, match:class ^(gamescope)$
windowrule = opacity 1.0 1.0, match:class .*

# Window Position
windowrule = center on, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrule = center on, match:class ^([Ww]hatsapp-for-linux)$
windowrule = center on, match:class ^([Ff]erdium)$

# Group rules, if needed:
# windowrule = group set, match:class ^(mpv)$, match:float false
# windowrule = group new, match:class ^(nemo)$

# Window Rules - Positioning
windowrule = center on, match:class ^([Tt]hunar)$, match:title ^(File Operation Progress)$
windowrule = center on, match:class ^([Tt]hunar)$, match:title ^(Confirm to replace files)$
windowrule = center on, match:title ^(ROG Control)$
windowrule = center on, match:title ^(Keybindings)$
windowrule = move 72% 7%, match:title ^(Picture-in-Picture)$
windowrule = workspace special silent, match:class ^(eww)$

# Avoid idle for fullscreen apps
windowrule = idle_inhibit fullscreen, match:class .*
windowrule = idle_inhibit fullscreen, match:title .*

# Animation Rules
windowrule = no_anim on, match:class ^(com.github.hluk.copyq)$

# Floating Rules
windowrule = float on, match:class ^(nemo)$, match:title ^(File Operation Progress)$
windowrule = float on, match:class ^(nemo)$, match:title ^(Confirm to replace files)$
windowrule = float on, match:class ^(nemo)$, match:title ^(Rename File)$
windowrule = float on, match:class ^(nemo)$, match:title ^(Move to Trash)$
windowrule = float on, match:class ^(nemo)$, match:title ^(Delete Permanently)$
windowrule = float on, match:class ^(nemo)$, match:title ^(Authentication Required)$

# Workspace Assignment
windowrule = workspace 1, match:class ^([Tt]hunderbird|eu.betterbird.Betterbird|org.gnome.Evolution)$
windowrule = workspace 2, match:class ^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Mm]icrosoft-edge(-stable|-beta|-dev|-unstable)?|[Gg]oogle-chrome(-beta|-dev|-unstable)?|[Tt]horium-browser|[Cc]achy-browser)$
windowrule = workspace 2, match:class ^(libreoffice-calc)$
windowrule = workspace 4, match:class ^(com.obsproject.Studio)$
windowrule = workspace 5, match:class ^([Ss]team|[Ll]utris)$
windowrule = workspace 6 silent, match:class ^(virt-manager|.virt-manager-wrapped)$
# windowrule = workspace 7, match:class ^([Dd]iscord|[Ww]ebCord|[Vv]esktop|[Ff]erdium|[Ww]hatsapp-for-linux|teams-for-linux)$
windowrule = workspace 9 silent, match:class ^([Aa]udacious)$

# Floating Windows
windowrule = float on, match:class ^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = float on, match:class ^([Zz]oom|onedriver|onedriver-launcher)$
windowrule = float on, match:class ^([Tt]hunar)$, match:title ^(File Operation Progress|Confirm to replace files)$
windowrule = float on, match:class ^(xdg-desktop-portal-gtk)$
windowrule = float on, match:class ^(org.gnome.Calculator)$, match:title ^(Calculator)$
windowrule = float on, match:class ^(codium|codium-url-handler|VSCodium|code-oss)$, match:title ^(Add Folder to Workspace)$
windowrule = float on, match:class ^(electron)$, match:title ^(Add Folder to Workspace)$
windowrule = float on, match:class ^([Rr]ofi)$
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = float on, match:class ^(kitty-dropterm)$
windowrule = float on, match:class ^(com.rtosta.zapzap)$
windowrule = float on, match:class ^(qalculate-gtk)$
windowrule = float on, match:class ^(org.kde.kdeconnect.app)$
windowrule = float on, match:class ^(nwg-look)$
windowrule = float on, match:class ^(org.kde.kclock)$
windowrule = float on, match:class ^(org.gnome.clocks)$
windowrule = float on, match:class ^(nm-applet|nm-connection-editor|blueman-manager)$
windowrule = float on, match:class ^(gnome-system-monitor|org.gnome.SystemMonitor|io.missioncenter.MissionCenter)$

# Opacity Settings
windowrule = opacity 0.95 0.95, match:class ^(com.ktechpit.whatsie)$
windowrule = opacity 0.9 0.8, match:class ^(qalculate-gtk)$
# windowrule = opacity 0.9 0.9, match:class ^(kitty)$
# windowrule = fullscreen on, opacity 0.9 0.9, match:class ^(kitty)$
windowrule = opacity 0.9 0.9, match:class ^(kitty-dropterm)$
# windowrule = no_anim on, match:class ^(kitty-dropterm)$
windowrule = opacity 0.90 0.70, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = opacity 0.95 0.65, match:class ^(io.missioncenter.MissionCenter)$
windowrule = opacity 0.90 0.60, match:class ^(org.kde.kcolorchooser|org.kde.kdeconnect.app)$

# Window Sizing
windowrule = size 70% 70%, match:class ^(gnome-system-monitor|org.gnome.SystemMonitor|io.missioncenter.MissionCenter)$
windowrule = size 55% 50%, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrule = size 70% 70%, match:class ^(xdg-desktop-portal-gtk)$
windowrule = size 60% 70%, match:title ^(Kvantum Manager)$
windowrule = size 60% 70%, match:class ^(qt6ct)$
windowrule = size 70% 70%, match:class ^(evince|wihotspot(-gui)?)$
windowrule = size 60% 70%, match:class ^(file-roller|org.gnome.FileRoller)$
windowrule = size 60% 70%, match:class ^([Ww]hatsapp-for-linux|[Ff]erdium)$
windowrule = size 60% 70%, match:title ^(ROG Control)$

# Pinning Windows
windowrule = pin on, match:title ^(Picture-in-Picture)$

# Additional Rules
windowrule = keep_aspect_ratio on, match:title ^(Picture-in-Picture)$
windowrule = stay_focused on, match:class ^(com.github.hluk.copyq)$
windowrule = opacity 0.9 0.9, match:class ^(com.github.hluk.copyq)$
windowrule = pin on, match:class ^(com.github.hluk.copyq)$
windowrule = no_anim on, match:class ^(com.github.hluk.copyq)$
windowrule = no_anim on, match:workspace special

## Workspace ##
windowrule = workspace 3 silent, match:title ^(home ais).*Oracle VirtualBox$
windowrule = workspace 3 silent, match:title ^(ture_nas).*Oracle VirtualBox$
windowrule = workspace 2 silent, match:class ^(Vivaldi-stable)$

## Bitwarden
windowrule = float on, match:class ^(vivaldi-stable)$, match:title (.*Bitwarden.*)
windowrule = size 450 650, match:class ^(vivaldi-stable)$, match:title (.*Bitwarden.*)
windowrule = center on, match:class ^(vivaldi-stable)$, match:title (.*Bitwarden.*)

# Ranger launched as the default file manager (xdg-open ~, etc.)
# Desktop entry launches: kitty --class ranger -e ranger %f
windowrule = float on, match:class ^(ranger)$, match:title ^(termfilechooser)$
windowrule = size 1527 953, match:class ^(ranger)$, match:title ^(termfilechooser)$
windowrule = center on, match:class ^(ranger)$, match:title ^(termfilechooser)$
